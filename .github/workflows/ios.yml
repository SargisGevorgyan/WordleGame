name: iOS

on:
  push:
    branches: [main]
    paths: ["WordleGame/**", "WordleGameTests/**", "WordleGame.xcodeproj/**", "shared/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["WordleGame/**", "WordleGameTests/**", "WordleGame.xcodeproj/**", "shared/**", ".github/workflows/ios.yml"]

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Pick an iPhone simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in sorted(d.items(), reverse=True) if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Unit tests (game rules, word bank, entitlements)
        run: |
          xcodebuild test \
            -project WordleGame.xcodeproj \
            -scheme WordleGame \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            | tail -n 200
          exit ${PIPESTATUS[0]}
