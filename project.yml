name: WordleGame
options:
  bundleIdPrefix: com.sargisgevorgyan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
  developmentLanguage: en

# Localizations bundled with the app (English + Armenian). XcodeGen also derives
# these from the *.lproj folders under WordleGame/Resources/.
knownRegions:
  - en
  - hy
  - Base

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO

# ---------------------------------------------------------------------------
# Google Mobile Ads (AdMob)
#
# Pinned to 11.x: the ad code uses the `GAD`-prefixed API that SDK 12 renamed.
# Ad code stays wrapped in `#if canImport(GoogleMobileAds)`.
# ---------------------------------------------------------------------------
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    majorVersion: "11.13.0"

targets:
  WordleGame:
    type: application
    platform: iOS
    sources:
      - path: WordleGame
      # Shared word bank (also read by the Android app in android/).
      - path: shared/words
        group: SharedWords
        buildPhase: resources
    entitlements:
      path: WordleGame/WordleGame.entitlements
      properties:
        com.apple.developer.game-center: true
        # iCloud key-value store: syncs stats and streaks (CloudStatsSync).
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    settings:
      base:
        INFOPLIST_FILE: WordleGame/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.sargisgevorgyan.wordlegame
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - package: GoogleMobileAds
        product: GoogleMobileAds

  WordleGameTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WordleGameTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sargisgevorgyan.wordlegame.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: WordleGame

schemes:
  WordleGame:
    build:
      targets:
        WordleGame: all
        WordleGameTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - WordleGameTests
